name: Build APK

# Builds the APK entirely in the cloud — no PC needed.
# Push the project (or tap "Run workflow"), then download the APK from the
# run's Artifacts section on your phone.

on:
  push:
    branches: [ "**" ]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"

      # ubuntu-latest ships with the Android SDK preinstalled (ANDROID_HOME set),
      # usually already including platform-34 + build-tools. sdkmanager isn't on
      # PATH, so call it by full path. Non-fatal: the build step is the real test.
      - name: Ensure Android SDK packages
        continue-on-error: true
        run: |
          echo "ANDROID_HOME=$ANDROID_HOME  ANDROID_SDK_ROOT=$ANDROID_SDK_ROOT"
          SDK="${ANDROID_SDK_ROOT:-$ANDROID_HOME}"
          SM="$SDK/cmdline-tools/latest/bin/sdkmanager"
          [ -x "$SM" ] || SM="$(ls "$SDK"/cmdline-tools/*/bin/sdkmanager 2>/dev/null | head -1)"
          echo "sdkmanager: $SM"
          if [ -x "$SM" ]; then
            yes | "$SM" --licenses > /dev/null 2>&1 || true
            "$SM" "platforms;android-34" "build-tools;34.0.0" || true
          fi
          echo "Platforms:";   ls "$SDK/platforms"   2>/dev/null || true
          echo "Build-tools:"; ls "$SDK/build-tools" 2>/dev/null || true

      - name: Build debug APK
        run: |
          chmod +x gradlew
          ./gradlew assembleDebug --no-daemon --stacktrace

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: DataBurner-debug-apk
          path: app/build/outputs/apk/debug/app-debug.apk
          if-no-files-found: error
